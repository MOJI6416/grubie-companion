plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.4' apply false
    id 'net.fabricmc.fabric-loom' version '1.19.4' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

def launcherDir = rootProject.file('../launcher/resources/companion')

tasks.register('collectJars', Sync) {
    group = 'build'
    description = 'Copies every target jar into build/libs-all.'
    subprojects.findAll { it.path.startsWith(':') && it.name != 'core' }.each { target ->
        from(target.tasks.named(target.ext.has('releaseJarTask') ? target.ext.releaseJarTask : 'jar'))
    }
    into layout.buildDirectory.dir('libs-all')
}

tasks.register('syncToLauncher') {
    group = 'build'
    description = 'Copies the target jars and their manifest into launcher/resources/companion.'
    dependsOn 'collectJars'
    doLast {
        def source = layout.buildDirectory.dir('libs-all').get().asFile
        launcherDir.mkdirs()
        launcherDir.listFiles().findAll { it.name.endsWith('.jar') }.each { it.delete() }
        def entries = []
        subprojects.findAll { it.name != 'core' }.sort { it.name }.each { target ->
            def jarName = "${target.ext.archiveBase}-${project.property('mod_version')}+${target.name}.jar"
            def jar = new File(source, jarName)
            if (!jar.exists()) throw new GradleException("Missing $jarName")
            def copy = new File(launcherDir, jarName)
            copy.bytes = jar.bytes
            def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(copy.bytes).encodeHex().toString()
            entries << [
                    file     : jarName,
                    loader   : target.ext.loaderName,
                    minecraft: target.ext.supportedVersions,
                    sha1     : sha1,
                    size     : copy.length()
            ]
        }
        def manifest = [version: project.property('mod_version'), files: entries]
        new File(launcherDir, 'manifest.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n'
    }
}

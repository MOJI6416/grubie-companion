name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-release
          path: build/release
      - name: Check the tag matches the mod version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow on a v<version> tag."
            exit 1
          fi
          test "${GITHUB_REF_NAME#v}" = "$VERSION"
        env:
          VERSION: ${{ needs.build.outputs.version }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          dir="build/release/$VERSION"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$draft" in
            missing)
              gh release create "$tag" --draft --verify-tag --title "Grubie Companion $VERSION" --notes "Jars for every supported Minecraft version and loader."
              ;;
            true)
              ;;
            *)
              echo "::error::$tag is already published. Published jars never change: release a new version."
              exit 1
              ;;
          esac
          gh release upload "$tag" "$dir"/*.jar "$dir/targets.json" --clobber
          gh release edit "$tag" --draft=false

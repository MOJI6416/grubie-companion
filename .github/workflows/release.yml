name: Release draft

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-release
          path: build/release
      - name: Check the tag matches the mod version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "${{ needs.build.outputs.version }}"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.build.outputs.version }}"
          tag="v$version"
          dir="build/release/$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "Grubie Companion $version" --notes "Jars for every supported Minecraft version and loader."
          fi
          gh release upload "$tag" "$dir"/*.jar "$dir/targets.json" --clobber

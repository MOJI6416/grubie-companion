name: Runtime

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "nodes = one Minecraft release per jar, all = every release each jar claims"
        required: true
        default: nodes
        type: choice
        options: [nodes, all]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  matrix:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-release
          path: build/release
      - id: matrix
        run: node scripts/runtime-matrix.mjs "build/release/${{ needs.build.outputs.version }}/targets.json" "${{ github.event.inputs.scope || 'all' }}" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.loader }} ${{ matrix.mc }}
    needs: [build, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-release
          path: build/release
      - name: Stage the jar
        run: |
          mkdir -p run/mods
          cp "build/release/${{ needs.build.outputs.version }}/${{ matrix.file }}" run/mods/
      - name: Start a stand-in launcher
        run: |
          python3 scripts/ci-bridge.py 47123 0123456789abcdef0123456789abcdef "$RUNNER_TEMP/bridge.log" &
          sleep 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Run Minecraft
        uses: headlesshq/mc-runtime-test@5.0.0
        env:
          GRUBIE_COMPANION_ADDRESS: 127.0.0.1:47123
          GRUBIE_COMPANION_TOKEN: 0123456789abcdef0123456789abcdef
          GRUBIE_COMPANION_SELFTEST: "1"
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.loader }}
          java: ${{ matrix.java }}
          xvfb: true
          dummy-assets: true
      - name: Check the mod talked to the launcher
        if: always()
        run: |
          cat "$RUNNER_TEMP/bridge.log" || true
          grep -q 'token_ok=True' "$RUNNER_TEMP/bridge.log"
          grep -q '"stage":"world"\|"stage":"server"' "$RUNNER_TEMP/bridge.log"
          if ! grep -q '"stage":"selftest"' "$RUNNER_TEMP/bridge.log"; then
            echo "::warning::The panel selftest did not finish before the game quit"
          fi

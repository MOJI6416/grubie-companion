name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Mod version that was built
        value: ${{ jobs.merge.outputs.version }}

permissions:
  contents: read

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test -Pcompanion.only=1.21.1-fabric --no-daemon

  nodes:
    name: Jars (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: fabric
            only: fabric
          - group: forge-legacy
            only: 1.16.5-forge,1.17.1-forge,1.18.2-forge,1.19.2-forge,1.19.4-forge,1.20.1-forge,1.20.4-forge
          - group: forge-modern
            only: 1.20.6-forge,1.21.1-forge,1.21.4-forge,1.21.5-forge,1.21.8-forge,1.21.10-forge,1.21.11-forge,26.1.2-forge,26.2-forge,26.3-forge
          - group: neoforge
            only: neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build jars
        run: ./gradlew collectRelease -Pcompanion.only=${{ matrix.only }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.group }}
          path: build/release
          if-no-files-found: error

  merge:
    name: Merge release
    needs: [core, nodes]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.merge.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - id: merge
        name: Merge targets.json
        run: node scripts/merge-parts.mjs parts build/release >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: companion-release
          path: build/release
          if-no-files-found: error

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'grubie-companion'

include 'core'

file('targets').listFiles()
        .findAll { it.isDirectory() && new File(it, 'build.gradle').exists() }
        .collect { it.name }
        .sort()
        .each { name ->
            include name
            project(":$name").projectDir = file("targets/$name")
        }
